<!DOCTYPE html>
<html lang="pt-BR">
<head><!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria do Harry Potter</title>
<style>
body{margin:0;font-family:Arial;background:#FFF8F0;color:#2B1B12}
.topo{background:#2B1B12;color:#FFD700;padding:25px;text-align:center}
.cardapio{max-width:900px;margin:20px auto;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:15px;padding-bottom:160px}
.item{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);border:1px solid #eee;text-align:center}
.emoji{font-size:70px;padding:15px 0 5px 0;background:#FFF3E0;display:block}
.info{padding:12px}
.info h3{margin:0 0 5px 0;font-size:16px}
.info p{margin:0;color:#666;font-size:13px}
.preco{color:#D32F2F;font-weight:bold;font-size:18px;margin:8px 0;display:block}
.info button{background:#2B1B12;color:#FFD700;border:0;width:100%;padding:10px;border-radius:8px;font-weight:bold}
.carrinho{position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid #2B1B12;padding:15px;max-width:900px;margin:auto}
.wpp{background:#25D366;color:white;width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="topo">
<h1>⚡ Pizzaria do Harry Potter 🍕</h1>
<p>Magia em cada fatia - Pedras de Fogo</p>
</div>
<div class="cardapio" id="lista"></div>
<div class="carrinho">
<div id="ped">🛒 Carrinho vazio</div>
<p><b>Total: R$ <span id="tot">0.00</span></b></p>
<button class="wpp" onclick="zap()">Pedir no WhatsApp</button>
</div>
<script>
let produtos=[
{n:"Pizza Hogwarts Suprema",d:"Calabresa, queijo e borda mágica",p:49.9,e:"🍕"},
{n:"Margherita Hermione",d:"Mussarela fresca e manjericão",p:42.9,e:"🧀"},
{n:"Calabresa do Hagrid",d:"Calabresa artesanal extra",p:45.9,e:"🔥"},
{n:"Doce de Grifinória",d:"Chocolate, morango e leite ninho",p:52.9,e:"🍫"},
{n:"Coca-Cola 1L",d:"Geladinha",p:10,e:"🥤"},
{n:"Poção de Guaraná",d:"Guaraná 1L",p:9,e:"🧪"}
];
let car=[];
function mostrar(){
document.getElementById("lista").innerHTML=produtos.map((x,k)=>`<div class="item"><div class="emoji">${x.e}</div><div class="info"><h3>${x.n}</h3><p>${x.d}</p><span class="preco">R$ ${x.p.toFixed(2)}</span><button onclick="add(${k})">+ Adicionar</button></div></div>`).join("");
}
function add(k){car.push(produtos[k]);up();}
function up(){
let t=car.reduce((s,a)=>s+a.p,0);
document.getElementById("tot").innerText=t.toFixed(2);
document.getElementById("ped").innerText=car.length?car.map(a=>a.n).join(", "):"🛒 Carrinho vazio";
}
function zap(){
if(!car.length){alert("Adicione alguma pizza!");return;}
let msg="Olá! Quero pedir na Pizzaria do Harry Potter:%0A%0A"+car.map(a=>"- "+a.n+" R$"+a.p).join("%0A")+"%0A%0ATotal: R$"+document.getElementById("tot").innerText;
window.open("https://wa.me/5581994028275?text="+msg,"_blank");
}
mostrar();
</script>
</body>
</html>
